# RBAC: 允许 init container 通过 K8s API 查询 pod-0 的 podIP
# init-env 需要 get pods 权限以发现 master 节点 IP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mx-sglang-pd-prefill-sa
  namespace: metax-ai-pd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mx-sglang-pd-prefill-pod-reader
  namespace: metax-ai-pd
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mx-sglang-pd-prefill-pod-reader-binding
  namespace: metax-ai-pd
subjects:
  - kind: ServiceAccount
    name: mx-sglang-pd-prefill-sa
    namespace: metax-ai-pd
roleRef:
  kind: Role
  name: mx-sglang-pd-prefill-pod-reader
  apiGroup: rbac.authorization.k8s.io
