# SGLang Router Deployment — DeepSeek-V4-Flash-0731 (0.5.14, pp1) (sglang 默认网关, 与 llm-d EPP 并行)
#
# 用途: 与 llm-d EPP 网关做性能对比的第二个入口 (sglbench DeepSeek 场景默认走
#   ROUTER = 10.66.3.32:8001)。
#   集群外直连: http://<router 节点 IP>:8001/v1/chat/completions
#   Metrics:    http://<router 节点 IP>:29000/metrics
#
# ⚠ 地址必须指向各实例的 worker-index=0 (master) pod:
#   --prefill <ip>:8000 8998  (第二参数是 prefill 的 PD bootstrap 端口)
#   --decode  <ip>:8200
# ⚠ 必须填 master 的**宿主机 IP** (hostNetwork ⇒ podIP 即节点 IP); 别填 ClusterIP。
#   leader 漂移 (整组重建后 worker-index=0 换节点) 需同步更新 env 后重启。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-v4-0731-router
  labels:
    app: deepseek-v4-0731-router
    llm-d.ai/model: deepseek-v4-flash-0731
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepseek-v4-0731-router
  template:
    metadata:
      labels:
        app: deepseek-v4-0731-router
        llm-d.ai/model: deepseek-v4-flash-0731
    spec:
      serviceAccountName: mx-sglang-pd-lws
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: metax-sglang-pd-router-dsv4-0731
                    operator: In
                    values: ["true"]
      containers:
        - name: router
          # 独立路由镜像 (GPUStack maca-sglang-pdrouter-custom 同源, 轻量无 GPU 依赖)
          image: harbor.isuanova.com/metax/sglang:v0.5.12-glm5-rc4-pd
          imagePullPolicy: Always
          workingDir: /workspace
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              # RC 镜像 import SGLang 时会做 GPU device probe, CPU-only router 会崩:
              # 关闭 device opt + 打掉 import 期的 torch.cuda.get_device_name(0)
              export SGLANG_ENABLE_SPECIFIC_DEVICE_OPT=false
              _common_py=/opt/conda/lib/python3.10/site-packages/sglang/srt/utils/common.py
              if [ -f "${_common_py}" ]; then
                sed -i 's/"MetaX C600" in torch\.cuda\.get_device_name(0)/False/' "${_common_py}" || true
              fi

              [ -n "${PD_PREFILL_ENDPOINTS:-}" ] || { echo "[ROUTER][ERROR] PD_PREFILL_ENDPOINTS 未设置" >&2; exit 1; }
              [ -n "${PD_DECODE_ENDPOINTS:-}"  ] || { echo "[ROUTER][ERROR] PD_DECODE_ENDPOINTS 未设置"  >&2; exit 1; }

              _norm() { local e="$1"; e="${e#http://}"; e="${e#https://}"; printf '%s' "${e%/}"; }

              PRE_ARGS=()
              IFS=',' read -ra _pf <<< "${PD_PREFILL_ENDPOINTS}"
              for ep in "${_pf[@]}"; do
                [ -z "${ep}" ] && continue
                PRE_ARGS+=( --prefill "http://$(_norm "${ep}")" "${PD_BOOTSTRAP_PORT}" )
              done

              DEC_ARGS=()
              IFS=',' read -ra _dc <<< "${PD_DECODE_ENDPOINTS}"
              for ep in "${_dc[@]}"; do
                [ -z "${ep}" ] && continue
                DEC_ARGS+=( --decode "http://$(_norm "${ep}")" )
              done

              echo "[ROUTER] prefill=${#PRE_ARGS[@]} 项 decode=${#DEC_ARGS[@]} 项 (bootstrap=${PD_BOOTSTRAP_PORT})"

              exec /opt/conda/bin/python3 -m sglang_router.launch_router \
                --pd-disaggregation \
                "${PRE_ARGS[@]}" \
                "${DEC_ARGS[@]}" \
                --host 0.0.0.0 --port "${PD_ROUTER_HTTP_PORT}" \
                --prometheus-host 0.0.0.0 --prometheus-port "${PD_ROUTER_METRICS_PORT}" \
                --request-timeout-secs 18000 --health-check-timeout-secs 90
          env:
            # 逗号分隔的 "<ip>:<port>" 列表, 指向 worker-index=0 (master) 的宿主机 IP。
            # 当前占位: 部署后替换为实际 master IP (kubectl get pods -o wide | grep dsv4-0731)
            #   prefill → prefill-dsv4-0731-0:<8000>   decode → decode-dsv4-0731-0:<8200>
            - name: PD_PREFILL_ENDPOINTS
              value: "10.66.3.29:8000,10.66.3.31:8000,10.66.3.36:8000,10.66.3.28:8000"   # per-node: 4 个独立 prefill 引擎 (节点=29/31/36/28)
            - name: PD_DECODE_ENDPOINTS
              value: "10.66.3.35:8200,10.66.3.34:8200,10.66.3.33:8200,10.66.3.32:8200"   # per-node: 4 个独立 decode 引擎 (节点=35/34/33/32)
            - name: PD_BOOTSTRAP_PORT
              value: "8998"
            - name: PD_ROUTER_HTTP_PORT
              value: "8001"
            - name: PD_ROUTER_METRICS_PORT
              value: "29000"
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
            - name: metrics
              containerPort: 29000
              protocol: TCP
          resources:
            requests: { memory: "8Gi", cpu: "4" }
            limits:   { memory: "16Gi", cpu: "8" }
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      restartPolicy: Always
