# Mooncake Master — HiCache L3 全局元数据服务 (2026-09-26)
# 端口: 50051 RPC / 8080 Metadata HTTP / 9003 Metrics
# 镜像用与引擎相同的 0.5.12-maca...-llm (内含 /opt/conda/bin/mooncake_master)
apiVersion: v1
kind: Pod
metadata:
  name: mooncake-master
  labels:
    llm-d.ai/role: mooncake-master
    llm-d.ai/guide: pd-disaggregation
spec:
  nodeName: mxgpu-3-36
  restartPolicy: Always
  hostNetwork: true
  containers:
    - name: master
      image: harbor.isuanova.com/metax/sglang:0.5.13-dsv4-adapter-r4
      imagePullPolicy: Always
      command: ["/bin/bash", "-c"]
      args:
        - |
          export LD_LIBRARY_PATH=/opt/conda/lib:${LD_LIBRARY_PATH:-}
          exec /opt/conda/bin/mooncake_master \
            --rpc_address=0.0.0.0 \
            --rpc_port=50051 \
            --enable_http_metadata_server=true \
            --http_metadata_server_host=0.0.0.0 \
            --http_metadata_server_port=8080 \
            --metrics_port=9003
