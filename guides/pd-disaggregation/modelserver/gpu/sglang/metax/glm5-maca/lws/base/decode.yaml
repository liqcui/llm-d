# Decode LeaderWorkerSet — GLM-5.1 PD 分离 (llm-d 规范, 参照 deepseek-v4-flash/lws)
#
# 拓扑: LWS replicas=1, size=4 → 4 pods (1 个逻辑实例, 4 节点 × 8 卡 = 32 卡)
#   并行度: TP=32 DP=32 EP=32 (PD_DECODE_DP_SIZE/PD_DECODE_EP_SIZE), PP=1, MTP=4
#   启动:   pd-adapter.sh (ConfigMap) → bash sglang/decode.sh glm-5.sh <master-ip> 4 <rank>
#   端口:   modelserver 8200; routing-proxy sidecar 8000 (llm-d EPP 入口, kv-connector=sglang)
#          5600 (nixl KV 传输) / 5000 (dist-init)
#   EPP:    InferencePool pd-disaggregation 按 llm-d.ai/guide=pd-disaggregation 发现
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: decode-glm5
  labels:
    llm-d.ai/role: decode
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 4
    restartPolicy: RecreateGroupOnPodRestart
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/role: decode
          llm-d.ai/model: glm-5.1-w8a8
          llm-d.ai/guide: pd-disaggregation
      spec:
        hostNetwork: true
        hostIPC: true
        hostPID: true
        dnsPolicy: ClusterFirstWithHostNet
        serviceAccountName: mx-sglang-pd-lws
        # 宽限期 120s 降低新旧代交接窗口的 MCCL/Gloo 连接污染概率
        terminationGracePeriodSeconds: 120

        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: metax-sglang-pd-decode-glm5
                      operator: In
                      values: ["true"]
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    llm-d.ai/role: decode
                topologyKey: kubernetes.io/hostname

        securityContext: {}

        # ── llm-d routing-proxy sidecar (EPP 请求入口) ──
        initContainers:
          - name: routing-proxy
            image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
            imagePullPolicy: Always
            args:
              - --port=8000
              - --vllm-port=8200
              - --kv-connector=sglang
              - --zap-log-level=1
              - --secure-proxy=false
            ports:
              - containerPort: 8000
                name: sidecar
                protocol: TCP
            resources:
              requests: { memory: "8Gi", cpu: "4" }
              limits:   { memory: "16Gi", cpu: "8" }
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true

        containers:
          - name: modelserver
            image: harbor.isuanova.com/metax/sglang:v0.5.12-glm5-rc4-maca.ai.3.7.1.13-torch2.8-py310-ubuntu22.04-amd64
            imagePullPolicy: Always
            workingDir: /workspace
            command:
              - bash
              - -c
              - |
                set -e
                NODE_RANK_ID="${LWS_WORKER_INDEX:-0}"
                NNODES="${LWS_GROUP_SIZE:-4}"
                LEADER_HOST="${LWS_LEADER_ADDRESS%:*}"
                MASTER_IP=$(getent hosts "${LEADER_HOST}" 2>/dev/null | awk '{print $1}' | head -1)
                [ -z "$MASTER_IP" ] && MASTER_IP="${POD_IP}"
                echo "[LWS] RANK=${NODE_RANK_ID}/${NNODES} MASTER=${LEADER_HOST}(${MASTER_IP})"

                if ! grep -q "${HOSTNAME}" /etc/hosts 2>/dev/null; then
                  echo "${POD_IP} ${HOSTNAME}" >> /etc/hosts
                fi

                # ── 沐曦平台环境 (版本配置 maca-sglang-glm-pd-custom env 对齐) ──
                export CUDA_PATH=/opt/maca/tools/cu-bridge
                export MACA_PATH=/opt/maca
                export CUDA_QUEUE_SCHEDULE_POLICY=1
                export MACA_QUEUE_SCHEDULE_POLICY=1
                export CUDA_SMALL_PAGESIZE_ENABLE=1
                export MACA_SMALL_PAGESIZE_ENABLE=1
                export MACA_DIRECT_DISPATCH=1
                export TRITON_ENABLE_ELEMENTWISE_PK_FMA_OPT=True
                export TRITON_DISABLE_CUDA_OPT_MMA_PREFETCH=1
                export TRITON_DISABLE_MACA_OPT_MMA_PREFETCH=1
                export TRITON_ENABLE_CUDA_CHAIN_DOT_OPT=1
                export TRITON_ENABLE_MACA_CHAIN_DOT_OPT=1
                export TRITON_ENABLE_CUDA_COMPILER_INT8_OPT=1
                export TRITON_ENABLE_MACA_COMPILER_INT8_OPT=1
                export TRITON_ENABLE_CUDA_OPT_MOVE_DOT_OPERANDS_OUT_LOOP=1
                export TRITON_ENABLE_MACA_OPT_MOVE_DOT_OPERANDS_OUT_LOOP=1
                export TORCH_CUDA_ARCH_LIST="8.0 8.6+PTX"
                export TORCH_MACA_ARCH_LIST="8.0 8.6+PTX"
                export PYTORCH_ENABLE_PG_HIGH_PRIORITY_STREAM=1
                export GLOO_SOCKET_IFNAME=manage0
                export NCCL_SOCKET_IFNAME=manage0
                export MCCL_SOCKET_IFNAME=manage0
                export NCCL_IB_HCA="=mlx5_0,mlx5_1"
                export MCCL_IB_HCA="=mlx5_0,mlx5_1"
                export NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME=manage0
                export MXSHMEM_BOOTSTRAP_UID_SOCK_IFNAME=manage0
                export NVSHMEM_DISABLE_CUDA_VMM=1
                export MXSHMEM_DISABLE_MACA_VMM=1
                export NVSHMEM_SYMMETRIC_SIZE=3g
                export MXSHMEM_SYMMETRIC_SIZE=3g
                export NVSHMEM_HCA_LIST=mlx5_1
                export MXSHMEM_HCA_LIST=mlx5_1
                export MACA_GRAPH_LAUNCH_QUEUE_POLICY=3
                export SGLANG_DISAGGREGATION_QUEUE_SIZE=8
                export SGLANG_DISAGGREGATION_THREAD_POOL_SIZE=24
                export SGL_DISABLE_TP_MEMORY_INBALANCE_CHECK=1
                export USE_INDEX_CACHE=1
                export PYTHONFAULTHANDLER=1
                export PYTHONUNBUFFERED=1
                export RES_OPTIONS="timeout:1 attempts:1"
                ulimit -l unlimited

                cd /workspace/llm-launch
                # ── 日志落盘 (Pod 重建后仍可回溯崩溃现场) ──
                mkdir -p /var/log/sglang-glm5
                echo "[LWS] $(date '+%F %T') group start rank=${NODE_RANK_ID}/${NNODES}" >> /var/log/sglang-glm5/${PD_ROLE}-rank${NODE_RANK_ID}.log
                # 拓扑解析/调参覆盖/启动摘要/拉起引擎 全部由 ConfigMap 挂载的
                # pd-adapter.sh 完成 (模型 spec 默认 glm-5, 可经 PD_MODEL_SPEC env 覆盖)
                bash /workspace/llm-d/pd-adapter.sh 2>&1 | tee -a /var/log/sglang-glm5/${PD_ROLE}-rank${NODE_RANK_ID}.log
                exit "${PIPESTATUS[0]}"
            env:
              - name: POD_IP
                valueFrom:
                  fieldRef: { fieldPath: status.podIP }
              - name: PD_ROLE
                value: "decode"
              # fork 默认 EnvBool(True) → disagg decode idle 时池核算微差即 raise 杀死 scheduler;
              # 恢复上游默认 False (仅告警)
              - name: SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE
                value: "false"
              # ── 可调参数 (pd-adapter 读取并回写 config.sh / models/glm-5.sh) ──
              - name: SGLANG_CONTEXT_LENGTH
                value: "200000"
              - name: SGLANG_MODEL_PATH
                value: "/workspace/data/GLM-5.2-W8A8"
              - name: PD_DECODE_MAX_RUNNING_REQUESTS
                value: "16"
              - name: PD_DECODE_MTP
                # ⚠ 必须落在镜像 models/glm-5.sh 的 mem 查表行内 (dp=32 时仅 mtp=2/3 有行):
                #   (32,2,1)=0.82 / (32,3,1)=0.83; mtp=4 只有 dp=64 行 → Fatal 查表失败
                value: "3"    # MTP draft tokens (=1 关闭推测解码)
              - name: PD_DECODE_DP_SIZE
                value: "32"
              - name: PD_DECODE_EP_SIZE
                value: "32"
              - name: PD_MEM_FRACTION_STATIC
                value: "0.8"
              - name: SGLANG_QUANTIZATION
                value: "compressed-tensors"
            securityContext:
              privileged: true
              runAsGroup: 44
            ports:
              - name: modelserver
                containerPort: 8200
                protocol: TCP
              - name: nixl
                containerPort: 5600
                protocol: TCP
              - name: dist-init
                containerPort: 5000
                protocol: TCP
            resources:
              limits:   { memory: "1000Gi", cpu: "160", "metax-tech.com/gpu": "8" }
              requests: { memory: "32Gi", cpu: "8", "metax-tech.com/gpu": "8" }
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: model-data
                mountPath: /workspace/data
              - name: mxdriver
                mountPath: /opt/mxdriver
                readOnly: true
              - name: mxcd
                mountPath: /dev/mxcd
              - name: sglang-log
                mountPath: /var/log/sglang-glm5
              - name: pd-adapter
                mountPath: /workspace/llm-d
                readOnly: true
            startupProbe:
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 90
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 180
            livenessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
            readinessProbe:
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 5
              timeoutSeconds: 10
              failureThreshold: 3

        volumes:
          - name: dshm
            emptyDir: { medium: Memory, sizeLimit: 100Gi }
          - name: model-data
            hostPath: { path: /data, type: DirectoryOrCreate }
          - name: mxdriver
            hostPath: { path: /opt/mxdriver, type: DirectoryOrCreate }
          - name: mxcd
            hostPath: { path: /dev/mxcd, type: CharDevice }
          - name: sglang-log
            hostPath: { path: /var/log/sglang-glm5, type: DirectoryOrCreate }
          - name: pd-adapter
            configMap:
              name: pd-smart-adapter-glm5
              defaultMode: 0555
