# 供 PD launcher 通过 K8s API 读取 leader pod 的**真实 host IP**。
# hostNetwork 下 podIP == 节点 IP, 这正是 SGLang --dist-init-addr 需要的地址;
# 用 Service ClusterIP 不符合 hostNetwork 语义 (用户明确要求用宿主机 IP)。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mx-sglang-pd-pod-reader
  namespace: metax-ai-pd
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mx-sglang-pd-pod-reader
  namespace: metax-ai-pd
subjects:
  - kind: ServiceAccount
    name: mx-sglang-pd-lws
    namespace: metax-ai-pd
roleRef:
  kind: Role
  name: mx-sglang-pd-pod-reader
  apiGroup: rbac.authorization.k8s.io
