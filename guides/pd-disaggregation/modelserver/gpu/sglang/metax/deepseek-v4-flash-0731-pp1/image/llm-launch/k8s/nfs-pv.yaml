apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv
  namespace: deepseek-pd
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    path: /root/mxtz/projects
    server: 10.200.119.26
