apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ══════════════════════════════════════════════════════════════════════════
# 变体: 最优解 (2026-09-26 调参实验终版, 见 OPTIMIZATION.md)
#
# 部署:  kubectl apply -k <此目录>        (或 ./deploy.sh optimal)
# 卸载:  kubectl delete -k <此目录>
#
# 与 official/ 的唯一差异 = decode.yaml / prefill.yaml 的 env 值:
#   Decode : tp=8/dp=4/ep=8/pp=1 (每节点一个 DP replica, 节点内 TP/A2A),
#            mem 0.75, EAGLE draft=5, EPLB 开, max-running 40×dp4=160
#   Prefill: tp=8/dp=4/pp=1, mem 0.82, chunked 4096, max-running 64×dp4=256
# 实测基准 (2026-09-26, 同镜像同压测条件, 512ctx/128out/100req/rate20):
#   Output 1238 tok/s / TTFT 0.82s / TPOT 36.8ms (vs 官方默认 4.1x / 36x)
# ══════════════════════════════════════════════════════════════════════════

namespace: metax-ai-pd

resources:
  # 两套变体共用的基座 (router/services/sa/launcher/rbac, 只维护一份)
  - ../shared
  # 本变体专属 (与 official/ 的差异全在这两个文件)
  - decode.yaml
  - prefill.yaml

# 镜像集中覆盖: 换仓库/换 tag 只改这里
images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: harbor.isuanova.com/metax/sglang
    newTag: 0.5.12-maca.ai3.8.2.7-torch2.10-py312-ubuntu22.04-amd64-llm
  - name: REPLACE_ROUTING_SIDECAR_IMAGE
    newName: registry.cubestack.io:5000/llm-d/llm-d-router-disagg-sidecar
    newTag: v0.9.0
