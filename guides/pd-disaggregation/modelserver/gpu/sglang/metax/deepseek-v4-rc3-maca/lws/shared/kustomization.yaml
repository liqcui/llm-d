apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 两套变体 (official/ optimal/) 共用的资源基座。
# 变体 kustomization 用 `resources: [../shared, ...]` 引用本目录;
# namespace 与 images 由各变体自行设置。

resources:
  - router.yaml
  - services.yaml
  - serviceAccount.yaml
  - launcher-configmap.yaml
  - rbac.yaml
