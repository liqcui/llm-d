# Decode LeaderWorkerSet — DeepSeek-V4 (rc3-maca) PD 分离
#
# 拓扑: LWS replicas=1, size=4 → 1 个 4 节点逻辑实例 (4 pods / 4 节点 / 32 卡)
#   LWS 自动注入: LWS_WORKER_INDEX → --node-rank (0..3)
#                 LWS_LEADER_ADDRESS → --dist-init-addr 的 host
#                 LWS_GROUP_SIZE (4) → --nnodes
#   并行度: tp=8 dp=4 ep=8 (4 节点各 1 个 DP replica), pp=1
#   端口:   modelserver 8200; routing-proxy sidecar 8000 (llm-d EPP 入口)
#
# 启动模式 (PD_LAUNCH_MODE, 见 launcher-configmap.yaml 头部):
#   explicit (默认) 本层显式拼装 launch_server argv, 参数全部可 env 覆盖
#   official        跑镜像内官方 /workspace/llm-launch/sglang/decode.sh
#
# ⚠ 仅 worker-index=0 是有效入口: 其余 worker 的 8200 是残接口, sidecar 也会
#   转发到不服务 HTTP 的 rank。InferencePool 按 worker-index="0" 过滤
#   (见 TROUBLESHOOTING.md §5), 与 GLM 4 节点实例同一约束。
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: decode-dsv4rc3
  labels:
    llm-d.ai/role: decode
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 4
    restartPolicy: RecreateGroupOnPodRestart
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/role: decode
          llm-d.ai/model: deepseek-v4-rc3-maca
          llm-d.ai/guide: pd-disaggregation
      spec:
        hostNetwork: true
        hostPID: true
        hostIPC: true
        # ⚠ hostNetwork: true 时 dnsPolicy: ClusterFirst 会被 kubelet **忽略**,
        #   实际退化为节点自身的 resolv.conf (等价 Default) —— 集群 DNS 不可用。
        #   后果: LWS_LEADER_ADDRESS (如 decode-dsv4rc3-0.decode-dsv4rc3) 解析不到。
        #     · rank0 仍可用 (回退 POD_IP, 在 hostNetwork 下即本节点 IP, 正是 master)
        #     · rank1-3 无法推导 master, 必须显式提供 PD_MASTER_IP (见 env)
        #   若希望改回用集群 DNS 解析 leader, 将此值改为 ClusterFirstWithHostNet。
        dnsPolicy: ClusterFirst
        serviceAccountName: mx-sglang-pd-lws
        # 宽限期 120s: 降低整组重建时新旧代交接窗口的 MCCL/Gloo 连接污染概率
        terminationGracePeriodSeconds: 120

        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: metax-sglang-pd-decode-dsv4rc3
                      operator: In
                      values: ["true"]
          # size=4 必须落到 4 台不同物理节点
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    llm-d.ai/role: decode
                topologyKey: kubernetes.io/hostname

        securityContext: {}

        # ── llm-d routing-proxy sidecar (EPP 请求入口) ──
        # kv-connector=sglang → 按 sglang 默认 bootstrap 8998 查询 prefill
        initContainers:
          - name: routing-proxy
            image: REPLACE_ROUTING_SIDECAR_IMAGE
            imagePullPolicy: Always
            args:
              - --port=8000
              - --vllm-port=8200
              - --kv-connector=sglang
              - --zap-log-level=1
              - --secure-proxy=false
            ports:
              - containerPort: 8000
                name: sidecar
                protocol: TCP
            resources:
              requests: { memory: "8Gi", cpu: "4" }
              limits:   { memory: "16Gi", cpu: "8" }
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true

        containers:
          - name: modelserver
            image: REPLACE_MODEL_SERVER_IMAGE
            imagePullPolicy: Always
            workingDir: /workspace
            command:
              - bash
              - -c
              - |
                set -euo pipefail

                # hostNetwork 下补全自身 hostname 解析
                if ! grep -q "${HOSTNAME}" /etc/hosts 2>/dev/null; then
                  echo "${POD_IP} ${HOSTNAME}" >> /etc/hosts
                fi

                ulimit -l unlimited || true

                # 预留端口, 避免 hostNetwork 下被随机占用
                sysctl -w net.ipv4.ip_local_reserved_ports="${PD_HTTP_PORT},${PD_BOOTSTRAP_PORT},${PD_DIST_INIT_PORT}" 2>/dev/null || true

                # C500 JIT 缓存清理 (与 GLM / dsv4 方案对齐)
                rm -rf /root/.cache/tvm-ffi

                # 日志落盘: hostPath, Pod 重建后仍在
                mkdir -p /var/log/sglang-dsv4rc3
                LOG=/var/log/sglang-dsv4rc3/${PD_ROLE}-rank${LWS_WORKER_INDEX:-0}.log
                echo "[LWS] $(date '+%F %T') group start rank=${LWS_WORKER_INDEX:-0}/${LWS_GROUP_SIZE:-1}" >> "${LOG}"

                # exec + 进程替换: PID1 最终是 python3, 保证 SIGTERM 直达引擎
                exec bash /workspace/llm-d/pd-launcher.sh > >(tee -a "${LOG}") 2>&1
            env:
              # ── 角色 ──
              - name: PD_ROLE
                value: "decode"
              # sglang 只装在 conda 环境; 不把 /opt/conda/bin 放进 PATH 会导致
              # python3 -m sglang.launch_server 报 ModuleNotFoundError
              - name: PATH
                value: "/opt/conda/bin:/opt/maca/bin:/opt/maca/mxgpu_llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              - name: PD_PYTHON_BIN
                value: "/opt/conda/bin/python3"
              - name: POD_IP
                valueFrom:
                  fieldRef: { fieldPath: status.podIP }
              - name: POD_NAME
                valueFrom:
                  fieldRef: { fieldPath: metadata.name }
              # ⚠ 因 dnsPolicy: ClusterFirst (hostNetwork 下集群 DNS 被忽略),
              #   LWS leader 域名解析不到, 此值**必须**能得到 leader 的**真实 host IP**。
              #
              # ⛔ 不要填 services.yaml 里 decode-dist-master 的 ClusterIP:
              #   decode 开了 --enable-dp-attention (dp=32), sglang 会从
              #   --dist-init-addr 推导一个 **ZMQ 握手端点** tcp://<host>:<port+13>
              #   (DP_ATTENTION_HANDSHAKE_PORT_DELTA=13, data_parallel_controller.py:308),
              #   node0 在该地址 bind 一个 REP socket, 其余 3 个节点**直连 node0** 握手。
              #   ClusterIP 是虚拟 IP, 且作为本地地址存在于**每个节点**上 (kube-ipvs0),
              #   客户端连 ClusterIP:5013 会命中自己这座节点 → Connection refused;
              #   IPVS 也没有该端口的 service 规则。后果: node0 永久阻塞在
              #   _broadcast_ports_as_server, 其余节点 600s 后超时退出 →
              #   RecreateGroupOnPodRestart 整组重建 → 无限循环 (实测 decode 永远 1/2)。
              #   (prefill 是 dp=1, 不走 dp-attention 握手, 所以填 ClusterIP 也能起 ——
              #    但两角色统一留空, 避免这种"能起但语义错"的坑。)
              #
              # ✅ 留空 = 由 pd-launcher 按优先级解析:
              #   rank0 用自身 POD_IP; 其余 rank 通过 K8s API 查 leader(<lws>-0) 的 podIP
              #   (hostNetwork ⇒ podIP 即宿主机 IP)。依赖 rbac.yaml 的 mx-sglang-pd-pod-reader。
              #   ⚠ 别在组外手工填节点 IP: 整组重建后 leader 可能换节点。
              - name: PD_MASTER_IP
                value: ""

              # ── 启动模式 ──
              # explicit = 本层显式拼装 sglang.launch_server argv (当前使用)
              #   ⚠ 镜像 0.5.13-maca (MACA 3.8.1.3) **不带厂商 llm-launch 脚本**
              #     (/workspace/llm-launch 不存在), 只能走 explicit。
              #     下面的取值是把厂商 0.5.8-rc3 decode.sh 的**实测 argv 1:1 翻译**过来的
              #     (模型与拓扑都没变, 只是换镜像/换启动方式)。
              #     ⚠ 厂商脚本里做了 dp_size 乘法的项, 这里要填**乘完的结果**:
              #       chunked-prefill-size = 4096 × dp(32) = 131072
              #       max-running-requests  =    8 × dp(32) = 256
              # official = 跑镜像内 /workspace/llm-launch/sglang/decode.sh (仅旧镜像有)
              - name: PD_LAUNCH_MODE
                value: "explicit"

              # ── explicit: EAGLE 投机解码 (厂商 decode.sh 实测值) ──
              #   --speculative-algorithm=EAGLE --speculative-draft-model-path=<target 同目录>
              #   --speculative-eagle-topk=1 --speculative-num-draft-tokens=4 --speculative-num-steps=3
              #   (厂商 decode_mtp_specific=4 → steps=draft-1=3, topk 固定 1)
              - name: PD_SPECULATIVE_ENABLE
                value: "0"   # ⚠ 临时: 基础镜像 0.5.13-maca 的 EAGLE draft 抓图崩溃, 见下方注释
              - name: PD_SPECULATIVE_NUM_DRAFT_TOKENS
                value: "4"                        # → steps=3
              - name: PD_SPECULATIVE_EAGLE_TOPK
                value: "1"
              - name: PD_SPECULATIVE_NUM_STEPS
                value: "3"
              - name: PD_SPECULATIVE_DRAFT_MODEL_PATH
                value: "/workspace/data/DeepSeek-V4-Flash-FlexSMQ-AWQ-W8A8"

              # ── explicit: MoE 后端 (厂商 decode 用 deepep low_latency + deep_gemm) ──
              - name: PD_MOE_A2A_BACKEND
                value: "deepep"
              - name: PD_MOE_RUNNER_BACKEND
                value: "deep_gemm"
              - name: PD_MOE_DENSE_TP_SIZE
                value: "1"
              - name: PD_DEEPEP_MODE
                value: "low_latency"

              # ── 拓扑: 回写 config.sh 的 decode_{tp,dp,ep,pp}_size ──
              # 厂商默认 (config.sh): dp=ep=tp=nnodes×num_dies = 4×8 = 32, pp=1
              # 即 attention_tp=1 (每卡一个 attention/DP rank) —— 厂商已验证的形态。
              # 下面写死的就是厂商默认值, 要调只改这里 (official 模式会覆盖厂商公式)。
              - name: PD_TP_SIZE
                value: "32"
              - name: PD_DP_SIZE
                value: "32"
              - name: PD_EP_SIZE
                value: "32"
              - name: PD_PP_SIZE
                value: "1"

              # ── 显存 / 上下文 / chunk: 回写 config.sh + models/<spec>.sh ──
              # ⚠ 厂商是 get_decode_mem_fraction_static(gpu, dp, mtp) 查表, 表里
              #   (c550/mars-x201) 没有本 GPU → 查空会传 --mem-fraction-static="" 直接
              #   启动失败, 因此必须回写。该值有两个硬约束, 换 dp/mtp 档位必须重新标定:
              #   ① EAGLE draft worker: draft init 时可用显存 > draft 权重 / f  (§8)
              #   ② graph 捕获余量: 32 个 DP rank 同时抓 CUDA graph, 每个 rank 还要在
              #      f 之外再要几 GB; 余量不足时 MACA runtime 直接报
              #      `mcErrorIllegalAddress` / `invalid_xvm_pde`, 栈落在
              #      cuda_graph_runner.capture_one_batch_size, 报错极具误导性 (§13)
              #   实测: dp=4 时 0.82 差 42 MB 就 raise, 0.78 才够;
              #         dp=32 时 0.82 抓图期只剩 4.5 GB → 必崩, 故取 0.75。
              - name: PD_MEM_FRACTION_STATIC
                value: "0.75"                     # ⚠ 实测值: 0.82 在 dp=32 下 graph 捕获期崩溃, 见 §5.2 / TROUBLESHOOTING §13
              - name: PD_CONTEXT_LENGTH
                value: "131072"                   # 厂商 context_length_specific = 1024×128
              # ⚠ 厂商脚本里是 chunked_prefill_size_default(4096) × dp_size(32);
              #   explicit 模式要填**乘完后的终值**
              - name: PD_CHUNKED_PREFILL_SIZE
                value: "131072"
              # 厂商 decode_max_running_requests_specific(8) × dp_size(32) = 256
              - name: PD_MAX_RUNNING_REQUESTS
                value: "256"
              # 厂商 decode.sh 实测值 (prefill 侧是 0.2, 两角色不同)
              - name: PD_SWA_FULL_TOKENS_RATIO
                value: "0.4"
              # 厂商 decode.sh: --cuda-graph-bs 1..8 --cuda-graph-max-bs=8
              - name: PD_CUDA_GRAPH_MAX_BS
                value: "8"

              # ── EPLB ──
              # 厂商 decode.sh 仅当 decode_eplb_file_specific 非空才加
              # --enable-eplb --init-expert-location=<file>; 其默认值指向
              # /workspace/eplb/deepseek-v4/deepseek-v4.pt, 该文件在镜像内不存在。
              # 本层: 文件可挂载且 PD_EPLB_ENABLE=1 才回写, 否则回写空值=关闭并告警。
              - name: PD_EPLB_ENABLE
                value: "0"
              - name: PD_EPLB_FILE
                value: "/workspace/eplb/deepseek-v4/deepseek-v4.pt"

              # ── 网卡 / disagg 设备 (厂商默认 mlx5_bond_*, 本环境不同, 必须回写) ──
              #   hca_list          → NCCL_IB_HCA / NVSHMEM_HCA_LIST
              #   mooncake_ib_device → --disaggregation-ib-device (config.sh:157) + MOONCAKE_DEVICE
              - name: PD_HCA_LIST
                value: "mlx5_0,mlx5_1"
              - name: PD_MOONCAKE_IB_DEVICE
                value: "mlx5_0,mlx5_1"

              # ── 结构参数 ──
              - name: PD_MODEL_PATH
                value: "/workspace/data/DeepSeek-V4-Flash-FlexSMQ-AWQ-W8A8"
              - name: PD_HTTP_PORT
                value: "8200"
              - name: PD_BOOTSTRAP_PORT
                value: "8998"
              - name: PD_DIST_INIT_PORT
                value: "5000"
              - name: PD_HOST
                value: "0.0.0.0"

              # 厂商 config.sh 里 --enable-metrics 是注释状态;
              # 本项目要 Prometheus/Grafana 采集 → 解锁 (置 0 则保持厂商默认=关闭)
              - name: PD_ENABLE_METRICS
                value: "1"

              # ══════════════════════════════════════════════════════════
              # 以下为 explicit 模式专用参数 (official 模式下不生效):
              #   PD_DTYPE / PD_QUANTIZATION / PD_KV_CACHE_DTYPE
              #     → official 由 models/<spec>.sh 的 prefill_decode_model_args 提供
              #   PD_MAX_RUNNING_REQUESTS(总并发) / PD_MAX_PREFILL_TOKENS
              #   PD_CUDA_GRAPH_MAX_BS / PD_SWA_FULL_TOKENS_RATIO(official 由模型脚本
              #     给 decode 0.4 / prefill 0.2) / PD_LOAD_BALANCE_METHOD / PD_WATCHDOG_TIMEOUT
              #   PD_MOE_A2A_BACKEND / PD_MOE_RUNNER_BACKEND / PD_MOE_DENSE_TP_SIZE / PD_DEEPEP_MODE
              #   PD_DISAGG_IB_DEVICE (official 用 PD_MOONCAKE_IB_DEVICE)
              #   PD_SPECULATIVE_ALGO / PD_SPECULATIVE_EAGLE_TOPK / PD_SPECULATIVE_NUM_STEPS
              #   PD_EPLB_FLAG / PD_PREFILL_ROUND_ROBIN_BALANCE / PD_EXTRA_ARGS
              # 切回 explicit 时把需要的项取消注释即可 (脚本内均有默认值)。
              # ══════════════════════════════════════════════════════════

              # ── 沐曦平台环境 ──
              - name: CUDA_PATH
                value: "/opt/maca/tools/cu-bridge"
              - name: MACA_PATH
                value: "/opt/maca"
              - name: CUDA_QUEUE_SCHEDULE_POLICY
                value: "1"
              - name: MACA_QUEUE_SCHEDULE_POLICY
                value: "1"
              - name: CUDA_SMALL_PAGESIZE_ENABLE
                value: "1"
              - name: MACA_SMALL_PAGESIZE_ENABLE
                value: "1"
              - name: MACA_DIRECT_DISPATCH
                value: "1"
              - name: MACA_KERNEL_ARGS_POLICY
                value: "0x010E"
              - name: MACA_GRAPH_OPTIMIZE_POLICY
                value: "0x1"
              - name: MACA_GRAPH_LAUNCH_QUEUE_POLICY
                value: "3"
              - name: MACA_RING_BUFFER_SIZE
                value: "16384"
              - name: TVM_FFI_CUDA_ARCH_LIST
                value: "8.0 8.6"
              - name: MXSHMEM_HCA_LIST
                value: "mlx5_1"
              # ifname 由 launcher 按默认路由探测后导出 (见 PD_SOCKET_IFNAME=auto)
              - name: NVSHMEM_DISABLE_CUDA_VMM
                value: "1"
              - name: MXSHMEM_DISABLE_MACA_VMM
                value: "1"
              - name: NVSHMEM_SYMMETRIC_SIZE
                value: "3g"
              - name: MXSHMEM_SYMMETRIC_SIZE
                value: "3g"
              - name: NVSHMEM_HCA_LIST
                value: "mlx5_1"
              - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
                value: "1"
              - name: TRITON_ENABLE_ELEMENTWISE_PK_FMA_OPT
                value: "True"
              - name: TRITON_DISABLE_CUDA_OPT_MMA_PREFETCH
                value: "1"
              - name: TRITON_DISABLE_MACA_OPT_MMA_PREFETCH
                value: "1"
              - name: TRITON_ENABLE_CUDA_CHAIN_DOT_OPT
                value: "1"
              - name: TRITON_ENABLE_MACA_CHAIN_DOT_OPT
                value: "1"
              - name: TRITON_ENABLE_CUDA_COMPILER_INT8_OPT
                value: "1"
              - name: TRITON_ENABLE_MACA_COMPILER_INT8_OPT
                value: "1"
              - name: TRITON_ENABLE_CUDA_OPT_MOVE_DOT_OPERANDS_OUT_LOOP
                value: "1"
              - name: TRITON_ENABLE_MACA_OPT_MOVE_DOT_OPERANDS_OUT_LOOP
                value: "1"
              - name: TORCH_CUDA_ARCH_LIST
                value: "8.0 8.6+PTX"
              - name: TORCH_MACA_ARCH_LIST
                value: "8.0 8.6+PTX"
              - name: PYTORCH_ENABLE_PG_HIGH_PRIORITY_STREAM
                value: "1"
              # MCCL/MXSHMEM 网卡配置 — 按实际环境修改 (官方文档: 计算网卡列表)
              #   ⚠ PD_HCA_LIST 已在上方「网卡 / disagg 设备」块定义 (official 模式的
              #     回写源), 此处不再重复 —— 同名 env 在 Pod 里是非法重复项。
              # ⚠ 网卡名 **不要写死**: 本集群 mxgpu-3-28 的 IP 在 br-lan 上, manage0
              #   无地址 → 写死 manage0 会让 Gloo 报 "Unable to find address for: manage0"
              #   (scheduler 全灭)。explicit 模式由 launcher 按默认路由自动探测
              #   (= 厂商 get_net_primary_iface 的行为), 下面 4 个 ifname 变量由它导出,
              #   这里只留 PD_SOCKET_IFNAME=auto 作为总开关。
              - name: PD_SOCKET_IFNAME
                value: "auto"
              - name: NCCL_IB_HCA
                value: "=mlx5_0,mlx5_1"
              - name: MCCL_IB_HCA
                value: "=mlx5_0,mlx5_1"
              - name: SGLANG_DISAGGREGATION_QUEUE_SIZE
                value: "8"
              - name: SGLANG_DISAGGREGATION_THREAD_POOL_SIZE
                value: "24"
              # ⚠ DeepEP low_latency 硬约束: 该值必须 <= 1024
              #   (deepep.py:334 assert num_max_dispatch_tokens_per_rank <= 1024)
              #   推荐配置里的 8192 在 low_latency 下会被断言拒绝;
              #   取 GPUStack 已验证 DS 配置里的 256。
              - name: SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK
                value: "256"

              # ── DSv4 行为开关 ──
              # 换到 0.5.13-maca 镜像后, 这几个 rc3-fork 专属开关**不再设置**,
              # 让镜像自带默认值生效 (新镜像是沐曦自家构建, 默认值即其验证配置):
              #   · SGLANG_DSV4_FIX_TP_ATTN_A2A_SCATTER  新镜像默认 True (rc3 fork 要 False)
              #   · SGLANG_DEEPEP_BF16_DISPATCH          新镜像默认 False (rc3 手工设 1)
              #   · USE_SINGLE_STREAM_DISPATCH_OVERLAP / MX_SGLANG_ENABLE_KV_LAYOUT_FIX /
              #     USE_INDEX_CACHE                     新镜像里**已无此变量**(grep 无命中), 设了也无效
              # 其余平台/网络类 env 仍然保留 (与 sglang 版本无关)。
              #
              # ⚠ SGLANG_DEEPEP_BF16_DISPATCH=1 **必须保留** —— 与 rc3 无关, 是新镜像
              #   (0.5.13 + 自带 deep_ep) 的硬约束: sglang 的 deepep.py:833 只在
              #   use_fp8=True 时才给 low_latency_dispatch 传 topk_weights, 而镜像里的
              #   deep_ep.Buffer.low_latency_dispatch 签名**没有** topk_weights →
              #     TypeError: Buffer.low_latency_dispatch() got an unexpected keyword
              #                argument 'topk_weights'   (scheduler 全灭, decode 起不来)
              #   置 1 后走 need_bf16_dispatch 分支 (backend.is_deep_gemm() 为真),
              #   use_fp8 保持 False, 该 kwarg 不再传入。
              - name: SGLANG_DEEPEP_BF16_DISPATCH
                value: "1"
              - name: SGLANG_JIT_DEEPGEMM_PRECOMPILE
                value: "0"
              - name: SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK
                value: "1"
              # idle 期池核算微差即 raise 并杀 scheduler → 显式关闭 strict 检查
              # (新镜像里该开关仍存在)
              - name: SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE
                value: "false"
              - name: PYTHONFAULTHANDLER
                value: "1"
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: RES_OPTIONS
                value: "timeout:1 attempts:1"
            securityContext:
              privileged: true
              runAsGroup: 44
            ports:
              - name: modelserver
                containerPort: 8200
                protocol: TCP
              - name: nixl
                containerPort: 5600
                protocol: TCP
              - name: dist-init
                containerPort: 5000
                protocol: TCP
            resources:
              limits:   { memory: "1000Gi", cpu: "160", "metax-tech.com/gpu": "8" }
              requests: { memory: "32Gi", cpu: "8", "metax-tech.com/gpu": "8" }
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: model-data
                mountPath: /workspace/data
              - name: mxdriver
                mountPath: /opt/mxdriver
                readOnly: true
              - name: mxcd
                mountPath: /dev/mxcd
              - name: sglang-log
                mountPath: /var/log/sglang-dsv4rc3
              - name: pd-launcher
                mountPath: /workspace/llm-d
                readOnly: true
            # ⚠ LWS restartPolicy=RecreateGroupOnPodRestart: **任一容器重启都会整组重建**
            #   (重新加载 32 卡权重 ≈ 4-6 min)。探针因此要容忍慢启动/瞬时无响应 ——
            #   宁可晚判失败, 也不要因探针抖动把整组推倒重来。
            startupProbe:                # 最长容忍 ≈ 120 min (120s + 236×30s)
              httpGet:
                path: /health
                port: modelserver
              initialDelaySeconds: 120
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 236
            livenessProbe:               # 判定失败前容忍 10 min (40×15s)
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 40
            readinessProbe:              # 只影响是否接流量, 不影响重建
              httpGet:
                path: /health
                port: modelserver
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 6

        volumes:
          - name: dshm
            emptyDir: { medium: Memory, sizeLimit: 100Gi }
          - name: model-data
            hostPath: { path: /data, type: DirectoryOrCreate }
          - name: mxdriver
            hostPath: { path: /opt/mxdriver, type: DirectoryOrCreate }
          - name: mxcd
            hostPath: { path: /dev/mxcd, type: CharDevice }
          - name: sglang-log
            hostPath: { path: /var/log/sglang-dsv4rc3, type: DirectoryOrCreate }
          - name: pd-launcher
            configMap:
              name: pd-launcher
              defaultMode: 0555
