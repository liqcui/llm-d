# Headless Services — DeepSeek-V4-Flash-0731 (0.5.14, pp1) PD 分离
#
# Prefill headless: 8000 (modelserver, EPP/routing-proxy 入口), 8998 (PD bootstrap, sglang 默认,
#                   llm-d routing-proxy 按此端口查询), 5600 (nixl), 5000 (dist-init)
# Decode headless:  8000 (routing-proxy sidecar, EPP 入口), 8200 (modelserver), 5600 (nixl), 5000 (dist-init)
# llm-d.ai/guide=pd-disaggregation 标签使 EndpointSlice 被 InferencePool/EPP 发现。
---
apiVersion: v1
kind: Service
metadata:
  name: prefill-dsv4-0731-headless
  labels:
    llm-d.ai/role: prefill
    llm-d.ai/guide: pd-disaggregation
spec:
  clusterIP: None
  selector:
    llm-d.ai/role: prefill
  ports:
    - name: modelserver
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: bootstrap
      port: 8998
      targetPort: 8998
      protocol: TCP
    - name: nixl
      port: 5600
      targetPort: 5600
      protocol: TCP
    - name: dist-init
      port: 5000
      targetPort: 5000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: decode-dsv4-0731-headless
  labels:
    llm-d.ai/role: decode
    llm-d.ai/guide: pd-disaggregation
spec:
  clusterIP: None
  selector:
    llm-d.ai/role: decode
  ports:
    - name: sidecar
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: modelserver
      port: 8200
      targetPort: 8200
      protocol: TCP
    - name: nixl
      port: 5600
      targetPort: 5600
      protocol: TCP
    - name: dist-init
      port: 5000
      targetPort: 5000
      protocol: TCP
